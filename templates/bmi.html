{% extends "base.html" %}
{% block title %}BMI Calculator - MediGuide{% endblock %}
{% block content %}
<div class="grid-container">
    <div class="grid-x grid-padding-x align-center">
        <div class="cell large-6 text-center" style="margin-bottom: 2rem;">
            <h2><span style="color: var(--primary-color);">BMI</span> Calculator</h2>
            <p style="color: var(--text-muted);">Calculate your Body Mass Index to see if you're at a healthy weight.</p>
        </div>
        <div class="cell large-6">
            <div class="card">
                <div class="card-section">
                    <form method="POST">
                        <label style="color: var(--text-muted);">Weight (kg)
                            <input type="number" step="0.1" name="weight" required placeholder="e.g. 70" style="background: rgba(255,255,255,0.05); color: white; border-radius: 8px;">
                        </label>
                        <label style="color: var(--text-muted);">Height (cm)
                            <input type="number" step="0.1" name="height" required placeholder="e.g. 175" style="background: rgba(255,255,255,0.05); color: white; border-radius: 8px;">
                        </label>
                        <button type="submit" class="button primary expanded" style="margin-top: 1rem;">Calculate</button>
                    </form>
                    
                    {% if bmi %}
                    <div class="callout {{ color }}" style="margin-top: 1.5rem; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05);">
                        <h5 style="color: var(--text-light);">Your BMI: <strong style="color: var(--primary-color);">{{ bmi }}</strong></h5>
                        <p style="margin:0; color: var(--text-muted);">Category: <strong style="color: var(--text-light);">{{ category }}</strong></p>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
